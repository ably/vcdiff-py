name: Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: true
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      id: setup-python
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup poetry
      uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4
      with:
        poetry-version: '2.1.4'

    - name: Setup a local virtual environment
      env:
        PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
      run: |
        poetry env use "$PYTHON_PATH"
        poetry run python --version
        poetry config virtualenvs.create true --local
        poetry config virtualenvs.in-project true --local

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      name: Define a cache for the virtual environment based on the dependencies lock file
      id: cache
      with:
        path: ./.venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

    - name: Ensure cache is healthy
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: poetry run pip --version >/dev/null 2>&1 || (echo "Cache is broken, skip it" && rm -rf .venv)

    - name: Install dependencies
      run: poetry install

    - name: Run tests
      run: poetry run pytest --verbose --tb=short
